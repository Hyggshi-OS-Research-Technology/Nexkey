name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_PACKAGES: >-
    qt6-base-dev
    qt6-base-dev-tools

jobs:
  core:
    name: Core, CLI and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
             -DNEXKEY_BUILD_GUI=OFF -DNEXKEY_BUILD_FCITX5=OFF
             -DNEXKEY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  full:
    name: Qt6 tray, Fcitx5 addon and Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${QT_PACKAGES} libfcitx5core-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEXKEY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build the Debian package
        run: cmake --build build --target package
      - name: Inspect the package
        run: |
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb | grep -E 'nexkey-gui|fcitx5/nexkey.so|nexkey.desktop'
          dpkg-deb --contents build/*.deb > /dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: debian-package
          path: build/*.deb
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${QT_PACKAGES} libfcitx5core-dev
      - name: Build the AppImage
        run: ./scripts/package-appimage.sh --output-dir dist
      - name: Verify the image contents
        run: |
          cd dist
          ./NexKey-*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/nexkey-gui
          test -x squashfs-root/usr/bin/nexkey
          test -f squashfs-root/usr/share/applications/nexkey.desktop
          test -f squashfs-root/usr/lib/fcitx5/nexkey.so
          if [ -d squashfs-root/usr/include ]; then
            echo "development headers leaked into the image"
            exit 1
          fi
          ./squashfs-root/usr/bin/nexkey methods | grep -q telex
          ./squashfs-root/usr/bin/nexkey test --method vni tie6ng1 | grep -q .
          if ldd squashfs-root/usr/bin/nexkey-gui | grep -q "not found"; then
            echo "the tray application has unresolved libraries"
            exit 1
          fi
          sha256sum NexKey-*.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error
